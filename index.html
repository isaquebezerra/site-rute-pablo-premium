<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F6F1">
<title>Rute &amp; Pablo | Entrar</title>
<link rel="icon" href="assets/logo-rute-pablo.png">
<style>
  :root{--bg:#f8f6f1;--paper:#fffdfa;--olive:#596047;--gold:#b79a68;--ink:#30342e;--muted:#72766d;--err:#a0392b}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--paper);max-width:420px;width:100%;padding:36px 28px 32px;border-radius:14px;box-shadow:0 20px 60px rgba(48,52,46,.12);text-align:center}
  .logo{width:120px;height:auto;margin:0 auto 14px;display:block}
  h1{font:400 34px Georgia,serif;color:var(--olive);margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 22px;letter-spacing:.08em;text-transform:uppercase}
  label{display:block;text-align:left;font-size:13px;color:var(--muted);margin:14px 0 6px;letter-spacing:.04em}
  input{width:100%;padding:12px 14px;border:1px solid #d9d2c3;border-radius:8px;font-size:15px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s}
  input:focus{border-color:var(--gold)}
  button{margin-top:22px;width:100%;padding:13px 16px;background:var(--olive);color:#fff;border:none;border-radius:8px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:background .15s}
  button:disabled{opacity:.6;cursor:wait}
  .msg{margin-top:14px;min-height:18px;font-size:13px;color:var(--err)}
  .foot{margin-top:18px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
  <main class="card">
    <img src="assets/logo-rute-pablo.png" alt="Rute &amp; Pablo" class="logo" onerror="this.style.display='none'">
    <h1>Rute &amp; Pablo</h1>
    <p class="sub">Acesso restrito</p>
    <form id="f" autocomplete="off">
      <label for="u">Usuário</label>
      <input id="u" name="u" required autocapitalize="off" autocorrect="off" spellcheck="false">
      <label for="p">Senha</label>
      <input id="p" name="p" type="password" required>
      <button type="submit" id="btn">Entrar</button>
      <p class="msg" id="msg" aria-live="polite"></p>
    </form>
    <p class="foot">21.05.2027</p>
  </main>
<script>
(async function(){
  const EXPECTED = 'b7acdf3fd360baf181d7e38d67d912e70d8eec917904379f8f44f8b2c99addf9';
  if (sessionStorage.getItem('rp_auth') === '1') {
    location.replace('./site.html');
    return;
  }
  async function sha256(s){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  }
  const f = document.getElementById('f');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    btn.disabled = true;
    const u = document.getElementById('u').value.trim().toLowerCase();
    const p = document.getElementById('p').value;
    const h = await sha256(u + ':' + p);
    if (h === EXPECTED) {
      sessionStorage.setItem('rp_auth', '1');
      location.replace('./site.html');
    } else {
      msg.textContent = 'Usuário ou senha inválidos.';
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
